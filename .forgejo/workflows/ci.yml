name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Nexus Registries and Auth
        run: |
          npm config set registry https://nexus.haerle-lab.dev/repository/npm-group/
          npm config set "//nexus.haerle-lab.dev/repository/npm-group/:_authToken" "${NEXUS_NPM_TOKEN}"
          npm config set "//nexus.haerle-lab.dev/repository/npm-hosted/:_authToken" "${NEXUS_NPM_TOKEN}"
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test
